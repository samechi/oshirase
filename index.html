<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>さめちからのお知らせ</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
    <body>
        <div class="container">
            <header>

                <h1>さめちからのお知らせ</h1>
            </header>

            <main>
                <section class="section-title">
                    <h2><i class="fa-solid fa-calendar"></i> お知らせ（メイン）</h2>
                </section>

                <article class="card alert">
                    <div class="content">
                        <p class="date-range">05 / 02 — 05 / 03</p>
                        <p class="description">出張の為、返信が遅いです。（対応可：基本DM）</p>
                    </div>
                </article>
                <article class="card alert">
                    <div class="content">
                        <p class="date-range">05 / 07 09:00 — 17:00</p>
                        <p class="description">所用の為、連絡つきません。（対応可：DMのみ）</p>
                    </div>
                </article>

                <section class="section-title">
                    <h2><i class="fa-solid fa-circle-info"></i> お知らせ（その他）</h2>
                </section>

                <section class="card">
                    <ul class="info-list">
                        <li>ストレスが溜まるとコダックになります。（時々ヤドン）</li>
                    </ul>
                </section>

                <section class="section-title">
                    <h2><i class="fa-solid fa-circle"></i>基本的に連絡がつく時間</h2>
                </section>

                <section class="card">
                    <ul class="info-list">
                        <li>平日：9:00 - 26:30</li>
                        <li>休日：10:00 - 28:00</li>
                        <h5>※上記の時間以外でも連絡がつく場合があります。</h5>
                    </ul>
                </section>

                </main>

            <footer>
                <p>Last Updated: 2026.05.02</p>
                <p>&copy; 2026 Samechi Dayo</p>
            </footer>
        </div>
        </body>
    </html>
